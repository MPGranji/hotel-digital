name: hotel-digital

services:
  api:
    image: hotel-digital-api:local
    build:
      context: ./backend/src/HotelDigital.Api
      dockerfile: Dockerfile
    ports:
      - "${HOTEL_API_PORT:-5080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__HotelDatabase: "${HOTEL_DATABASE_CONNECTION_STRING:?Set HOTEL_DATABASE_CONNECTION_STRING in backend/.env}"
      Cors__AllowedOrigins__0: "${HOTEL_CORS_ORIGIN:-http://localhost:3000}"
    restart: unless-stopped

  frontend:
    image: hotel-digital-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5080}"
    depends_on:
      - api
    ports:
      - "${HOTEL_FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped
