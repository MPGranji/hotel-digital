name: hotel-digital

services:
  api:
    image: hotel-digital-api:local
    build:
      context: ./backend/src/HotelDigital.Api
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${HOTEL_API_PORT:-5080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Authentication__AdminPassword: "${HOTEL_ADMIN_PASSWORD:?Set HOTEL_ADMIN_PASSWORD in backend/.env}"
      Authentication__SigningSecret: "${HOTEL_AUTH_SIGNING_SECRET:?Set HOTEL_AUTH_SIGNING_SECRET in backend/.env}"
      Azure__SignalR__ConnectionString: "${HOTEL_SIGNALR_CONNECTION_STRING:-}"
      ConnectionStrings__HotelDatabase: "${HOTEL_DATABASE_CONNECTION_STRING:?Set HOTEL_DATABASE_CONNECTION_STRING in backend/.env}"
      Cors__AllowedOrigins__0: "${HOTEL_CORS_ORIGIN:-http://localhost:3000}"
    restart: unless-stopped

  frontend:
    image: hotel-digital-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5080}"
        NEXT_PUBLIC_POWER_BI_EMBED_URL: "${NEXT_PUBLIC_POWER_BI_EMBED_URL:-}"
    depends_on:
      - api
    ports:
      - "127.0.0.1:${HOTEL_FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped
